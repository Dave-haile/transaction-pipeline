[package]
edition = "2024"
name = "common"
version = "0.1.0"

[dependencies]
axum = "0.7.9"
chrono = { version = "0.4", features = ["serde"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
