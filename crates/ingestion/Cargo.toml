[package]
edition = "2024"
name = "ingestion"
version = "0.1.0"

[dependencies]
axum = "0.7.9"
common = { path = "../common" }
tokio = { version = "1", features = ["full"] }

dotenvy = "0.15"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rdkafka = { version = "0.36", features = ["tokio"] }

tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24.6"
