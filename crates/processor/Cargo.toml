[package]
name = "processor"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
rdkafka = { version = "0.36", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
clickhouse = { version = "0.13", features = ["chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
metrics = "0.24.6"
axum = "0.7.9"
